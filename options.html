<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Veil 設定</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <header><span class="mark">VEIL</span><h1>把注意力留給好留言。</h1><p>讓 Jev 依照你的條件，過濾 X 的文字留言。</p></header>
    <form id="settings">
      <label class="switch"><input id="enabled" type="checkbox"> 啟用留言過濾</label>
      <label for="apiKey">TypeSafe API Key</label>
      <input id="apiKey" type="password" autocomplete="off" placeholder="貼上你的 API Key">
      <label for="rules">你想屏蔽什麼？</label>
      <textarea id="rules" rows="5" maxlength="4000" required></textarea>
      <p class="hint">用自然語言描述，也可以寫明例外，例如：屏蔽推銷，保留批評推銷的留言。</p>
      <label for="threshold">符合機率門檻</label>
      <input id="threshold" type="number" min="0.5" max="1" step="0.01" required>
      <p class="hint">預設 0.85。越高越保守；這是起始設定，仍可能誤判。</p>
      <button type="submit">儲存設定</button>
      <p id="message" role="status"></p>
    </form>
    <footer>啟用後，瀏覽到的主文與留言文字會傳送給 TypeSafe，並可能產生 API 費用。金鑰儲存在本機插件中，不會同步。只隱藏目前頁面的留言，不會刪除 X 上的資料。關閉過濾後會恢復顯示。</footer>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
